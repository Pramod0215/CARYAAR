apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: ghcr.io/pramod0215/caryaar-auth:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: caryaar-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: caryaar-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: caryaar-secrets
                  key: jwt-secret-key
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cars
  template:
    metadata:
      labels:
        app: cars
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: cars
          image: ghcr.io/pramod0215/caryaar-cars:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: caryaar-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: caryaar-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: caryaar-secrets
                  key: jwt-secret-key
            - name: CAR_IMAGE_UPLOAD_DIR
              value: /app/backend/car_service/uploads
          volumeMounts:
            - name: car-uploads
              mountPath: /app/backend/car_service/uploads
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: car-uploads
          persistentVolumeClaim:
            claimName: car-uploads
---
