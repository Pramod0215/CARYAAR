apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/pramod0215/caryaar-frontend:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AUTH_API_URL
              value: http://auth:8000
            - name: CAR_API_URL
              value: http://cars:8000
            - name: FEEDBACK_API_URL
              value: http://feedback:8000
            - name: SUPPORT_API_URL
              value: http://support:8000
            - name: NOTIFICATIONS_API_URL
              value: http://notifications:8000
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: car-uploads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
